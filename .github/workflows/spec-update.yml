name: spec-update

on:
  push:
    branches:
      - "spec/**"

permissions: {}

concurrency:
  group: spec-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: validate docs
        run: npx --yes mint@4.2.1184 validate
      - name: open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "pull request already open for $BRANCH"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(spec): sync API spec (${BRANCH#spec/})" \
            --body "Synced from the core API spec. Review the API reference diff before merging."
